apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: widget-crd
  namespace: argocd
spec:
  project: platform-team

  source:
    repoURL: git@github.com:sairinraychoudhury/gitops-argocd-lab.git
    targetRevision: main
    path: apps/widget-crd

  destination:
    server: https://kubernetes.default.svc
    namespace: widget-crd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true