apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-team
  namespace: argocd
spec:
  description: "Platform team project - can manage CRDs and cluster-scoped resources"

  sourceRepos:
    - git@github.com:sairinraychoudhury/gitops-argocd-lab.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: widget-crd

  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

  roles:
    - name: platform-admin
      description: "Full control over platform-team apps"
      policies:
        - p, proj:platform-team:platform-admin, applications, *, platform-team/*, allow
      groups: []